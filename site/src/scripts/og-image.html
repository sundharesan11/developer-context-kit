<!doctype html>
<!--
  Source for public/og.png, the 1200×630 social preview. Not part of the build.
  Regenerate from site/ after editing (needs node_modules for the fonts):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=3000 \
      --screenshot=public/og.png "file://$PWD/src/scripts/og-image.html"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Inter Tight";font-weight:700;src:url(../../node_modules/@fontsource/inter-tight/files/inter-tight-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Inter Tight";font-weight:600;src:url(../../node_modules/@fontsource/inter-tight/files/inter-tight-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400;src:url(../../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#06080f;color:#edf0f7}
.card{position:relative;width:1200px;height:630px;padding:64px 72px;overflow:hidden;font-family:"Inter",sans-serif;
  background:radial-gradient(900px 420px at 72% 112%,rgba(255,138,61,.20),transparent 62%),radial-gradient(700px 360px at 8% -10%,rgba(116,224,204,.08),transparent 60%),#06080f}
.grid{position:absolute;left:-30%;right:-30%;bottom:-20px;height:300px;transform:perspective(360px) rotateX(58deg);transform-origin:50% 100%;
  background-image:linear-gradient(rgba(255,138,61,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(255,138,61,.42) 1px,transparent 1px);
  background-size:64px 40px;-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 85%);mask-image:linear-gradient(to top,#000 0%,transparent 85%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 160px rgba(0,0,0,.65)}
.top{position:relative;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font:600 34px/1 "Inter Tight",sans-serif;letter-spacing:-.02em}
.mark{width:46px;height:46px;border-radius:13px;background:#131a2b;border:1px solid #2a3349;display:grid;place-items:center}
.pill{font:500 17px/1 "JetBrains Mono",monospace;color:#a6b0c4;padding:10px 16px;border-radius:999px;border:1px solid rgba(150,170,215,.22);background:rgba(14,19,33,.75)}
.pill b{color:#ff8a3d;font-weight:500}
h1{position:relative;margin:58px 0 0;font:700 108px/.96 "Inter Tight",sans-serif;letter-spacing:-.05em}
h1 em{font-style:normal;background:linear-gradient(100deg,#ff8a3d 10%,#ffb07a);-webkit-background-clip:text;background-clip:text;color:transparent}
p{position:relative;margin:26px 0 0;max-width:820px;font-size:27px;line-height:1.4;color:#a6b0c4}
p strong{color:#edf0f7;font-weight:400}
.term{position:absolute;left:72px;bottom:60px;display:flex;gap:26px;align-items:center;font:500 19px/1 "JetBrains Mono",monospace;color:#a6b0c4;
  padding:16px 22px;border-radius:14px;background:rgba(6,8,15,.82);border:1px solid rgba(150,170,215,.2);box-shadow:0 24px 60px -24px rgba(255,138,61,.45)}
.term .p{color:#ff8a3d}.term .ok{color:#8fe39a}.term .c{color:#74e0cc}
.works{position:absolute;right:72px;bottom:74px;font:600 19px/1 "Inter Tight",sans-serif;color:#808aa2;display:flex;gap:22px;align-items:center}
.works i{display:inline-block;width:9px;height:9px;border-radius:2px;transform:rotate(45deg);background:#ff8a3d;margin-right:9px}
.works i.cx{background:#74e0cc}
.works i.gm{background:#b6c7ff}
.works span{color:#c9d0de}
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="top">
    <div class="brand">
      <span class="mark"><svg width="26" height="26" viewBox="0 0 14 14"><circle cx="7" cy="7" r="2.6" fill="#ff8a3d"/><circle cx="7" cy="7" r="5.6" fill="none" stroke="#ff8a3d" stroke-opacity=".5" stroke-width="1.1"/></svg></span>
      devtwin
    </div>
    <div class="pill"><b>open source</b> · Apache-2.0</div>
  </div>
  <h1>Clone the <em>developer.</em></h1>
  <p>Your decisions, constraints, commands and handoffs: <strong>a reviewed, cited brief at the start of every coding-agent session.</strong></p>
  <div class="term"><span><span class="p">›</span> /devtwin-resume</span><span><span class="ok">✓</span> brief loaded · <span class="c">acme.atlas</span></span></div>
  <div class="works"><span><i></i>Claude Code</span><span><i class="cx"></i>Codex</span><span><i class="gm"></i>Gemini CLI</span></div>
  <div class="scan"></div>
  <div class="vig"></div>
</div>
</body>
</html>
